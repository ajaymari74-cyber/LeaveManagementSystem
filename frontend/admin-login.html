<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center min-vh-100 py-4" style="background-color: var(--bg-color);">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10 col-xl-9">
        <div class="login-card-container">
          <div class="row g-0">
            
            <!-- Left: Hero Illustration with admin.png and mainlogo.svg -->
            <div class="col-12 col-md-5 login-illustration-side text-center text-white">
              
              <!-- Brand Header -->
              <div class="d-flex align-items-center gap-2 mb-3">
                <img src="assets/lottie/mainlogo.svg" alt="Company Logo" style="width: 44px; height: 44px; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.35);">
                <div class="text-start">
                  <div class="fw-bold fs-6 lh-sm text-white">LeavePortal</div>
                  <div style="font-size: 11.5px; color: #C3B9DE;">Admin Control Center</div>
                </div>
              </div>

              <!-- Centered Glass Illustration Frame with Curved Corners -->
              <div class="illustration-wrapper">
                <img src="assets/lottie/admin.png" alt="Admin Portal Illustration" class="img-illustration">
              </div>

              <div class="mt-2 text-center">
                <span class="badge px-3 py-1 mb-2" style="background-color: var(--accent-magenta); font-size: 11.5px; font-weight: 700; border-radius: 9999px;">Admin Governance</span>
                <p class="small mb-0" style="color: #D6CEEC; max-width: 250px; margin: 0 auto; line-height: 1.5;">Review employee applications and approve team leaves with precision.</p>
              </div>

            </div>

            <!-- Right: Admin Login Form -->
            <div class="col-12 col-md-7 p-4 p-md-5 bg-white d-flex flex-column justify-content-center">
              
              <div class="d-flex align-items-center justify-content-between mb-3">
                <div>
                  <h3 class="fw-bold mb-1" style="color: var(--text-primary); letter-spacing: -0.02em;">Administrator Sign In</h3>
                  <p class="text-muted-custom small mb-0">Authorized supervisor access credentials required</p>
                </div>
                <img src="assets/lottie/mainlogo.svg" alt="Logo" class="d-md-none" style="width: 36px; height: 36px; border-radius: 10px;">
              </div>

              <div id="error-alert" class="alert alert-danger py-2 small d-none rounded-3" role="alert"></div>

              <form id="admin-login-form">
                <div class="mb-3">
                  <label for="email" class="form-label small fw-semibold text-muted-custom">Administrator Email</label>
                  <div class="input-group">
                    <span class="input-group-text bg-white border-end-0" style="border-color: var(--border-color); color: var(--text-secondary); padding-left: 1rem;">
                      <i class="bi bi-shield-check"></i>
                    </span>
                    <input type="email" class="form-control border-start-0 ps-0" id="email" placeholder="admin@company.com" required autofocus>
                  </div>
                </div>

                <div class="mb-4">
                  <div class="d-flex justify-content-between align-items-center mb-1">
                    <label for="password" class="form-label small fw-semibold text-muted-custom mb-0">Admin Password</label>
                  </div>
                  <div class="input-group">
                    <span class="input-group-text bg-white border-end-0" style="border-color: var(--border-color); color: var(--text-secondary); padding-left: 1rem;">
                      <i class="bi bi-key"></i>
                    </span>
                    <input type="password" class="form-control border-start-0 ps-0" id="password" placeholder="••••••••" required>
                  </div>
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary w-100 py-2 mb-3" style="font-size: 15px;">
                  Access Admin Dashboard
                </button>
              </form>

              <div class="pt-3 border-top d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
                <span class="small text-muted-custom">Are you a regular team member?</span>
                <a href="employee-login.html" class="btn btn-sm btn-outline-primary py-1 px-3 rounded-pill">
                  <i class="bi bi-person-badge me-1"></i> Employee Portal
                </a>
              </div>

            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/admin-login.js"></script>
</body>
</html>
